<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Frontend MSAL - Entra ID</title>
    <!-- Carga de la librería oficial de MSAL -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
</head>
<body>
    <h1>Integración MSAL + Spring Boot</h1>
    
    <button id="loginBtn">1. Iniciar Sesión</button>
    <button id="apiBtn">2. Llamar API Protegida (/OT.Create)</button>
    
    <div style="margin-top: 20px;">
        <strong>Resultado:</strong>
        <pre id="output">Inicializando MSAL...</pre>
    </div>

    <script>
        // Toma automáticamente la URL actual sin parámetros
        const currentRedirectUri = window.location.href.split('?')[0].split('#')[0];

        const msalConfig = {
            auth: {
                clientId: "38141ba2-c99b-4254-b1d7-677aab61f43b",
                authority: "https://login.microsoftonline.com/b19dac1c-44c9-4e15-9214-59ae9f63b92e",
                redirectUri: currentRedirectUri
            },
            cache: {
                cacheLocation: "sessionStorage"
            }
        };

        const tokenRequest = {
            scopes: ["api://38141ba2-c99b-4254-b1d7-677aab61f43b/OT.Create"]
        };

        async function initMsal() {
            try {
                const msalInstance = new msal.PublicClientApplication(msalConfig);
                
                // Procesar el retorno desde Microsoft Azure
                const response = await msalInstance.handleRedirectPromise();

                if (response !== null) {
                    document.getElementById("output").innerText = "Sesión iniciada como: " + response.account.username;
                } else {
                    const accounts = msalInstance.getAllAccounts();
                    if (accounts.length > 0) {
                        document.getElementById("output").innerText = "Sesión activa: " + accounts[0].username;
                    } else {
                        document.getElementById("output").innerText = "Listo. Haz clic en '1. Iniciar Sesión'.";
                    }
                }

                // Evento Iniciar Sesión
                document.getElementById("loginBtn").onclick = () => {
                    msalInstance.loginRedirect(tokenRequest);
                };

                // Evento Consumir Backend
                document.getElementById("apiBtn").onclick = async () => {
                    try {
                        const accounts = msalInstance.getAllAccounts();
                        if (accounts.length === 0) {
                            alert("Primero debes iniciar sesión con el Botón 1.");
                            return;
                        }

                        tokenRequest.account = accounts[0];
                        const tokenResponse = await msalInstance.acquireTokenSilent(tokenRequest)
                            .catch(async () => await msalInstance.acquireTokenPopup(tokenRequest));

                        const response = await fetch("http://localhost:8080/api/protected/hello", {
                            headers: {
                                "Authorization": `Bearer ${tokenResponse.accessToken}`
                            }
                        });

                        const data = await response.text();
                        document.getElementById("output").innerText = `Respuesta HTTP ${response.status}:\n${data}`;
                    } catch (err) {
                        document.getElementById("output").innerText = "Error API: " + err.message;
                    }
                };

            } catch (error) {
                console.error("Error al inicializar MSAL:", error);
                document.getElementById("output").innerText = "Error de inicialización MSAL:\n" + error.message;
            }
        }

        initMsal();
    </script>
</body>
</html>
