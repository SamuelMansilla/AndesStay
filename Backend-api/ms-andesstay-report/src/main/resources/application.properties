server.port=8084
spring.application.name=ms-andesstay-report

# Conexión Supabase (Transaction Pooler IPv4 puerto 6543)
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.rqoexnwaqkoqfkdccoaw
spring.datasource.password=Samu19042004@.
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración HikariCP para no saturar el pool de Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ─────────────────────────────────────────────────────────────────────────────
# Kafka Streaming (EP5). Consume reservations.events con DTO tipado.
# ─────────────────────────────────────────────────────────────────────────────
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.consumer.group-id=andesstay-report-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.duocuc.ms_andesstay_report.dto.ReservationEventDTO
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.andesstay.*,com.duocuc.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000

# Topología y comportamiento del consumidor
andesstay.kafka.topics.reservations-events=reservations.events
andesstay.kafka.topics.audit-timeline=audit.timeline
andesstay.kafka.consumer.concurrency=3
andesstay.kafka.consumer.simulated-delay-ms=0