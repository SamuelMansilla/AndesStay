server.port=8081
spring.application.name=ms-andesstay-reservations

# Conexión Supabase (Transaction Pooler IPv4 puerto 6543)
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.rqoexnwaqkoqfkdccoaw
spring.datasource.password=Samu19042004@.
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración HikariCP para no saturar el pool de Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Kafka Streaming (se habilita en EC2 con KAFKA_ENABLED=true y KAFKA_BOOTSTRAP_SERVERS=<ip>:9092)
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=2

# URLs de servicios internos para fallback local (sin Kafka)
services.report.url=${SERVICES_REPORT_URL:http://localhost:8084}
services.audit.url=${SERVICES_AUDIT_URL:http://localhost:8085}