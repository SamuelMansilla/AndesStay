server.port=8081
spring.application.name=ms-andesstay-reservations

# Conexión Supabase (Transaction Pooler IPv4 puerto 6543)
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.rqoexnwaqkoqfkdccoaw
spring.datasource.password=Samu19042004@.
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración HikariCP para no saturar el pool de Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Kafka Streaming (se habilita en EC2 con KAFKA_ENABLED=true y KAFKA_BOOTSTRAP_SERVERS=<ip>:9092)
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=2

# URLs de servicios internos para fallback local (sin Kafka)
services.report.url=${SERVICES_REPORT_URL:http://localhost:8084}
services.audit.url=${SERVICES_AUDIT_URL:http://localhost:8085}

# ─────────────────────────────────────────────────────────────────────────────
# RabbitMQ (EP3, tarea 07): reservations actúa como PRODUCTOR de eventos de
# negocio. Los defaults corresponden al cluster local de infra/mq/compose.yml.
# connection-timeout corto: si el broker no está disponible, la publicación
# falla rápido y no retiene hilos (el core nunca se bloquea).
# ─────────────────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:andesstay}
spring.rabbitmq.password=${RABBITMQ_PASS:AndesStay2024!}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:andesstay}
spring.rabbitmq.connection-timeout=2000

# ── Topología de mensajería (misma convención que ms-andesstay-notify) ───────
# Regla (indicador 1): ningún nombre de exchange, cola o routing key se escribe
# como literal en el código Java; todos se inyectan desde MessagingProperties.
# El dueño de la declaración de la topología es ms-andesstay-notify (tarea 03);
# reservations sólo publica usando estos nombres.
# Convención: q.<dominio>.<acción> | ex.andesstay.<dominio> | <dominio>.<acción>
andesstay.messaging.exchange=ex.andesstay.notifications
andesstay.messaging.dlx=ex.andesstay.dlx
andesstay.messaging.dlq=q.andesstay.dlq
andesstay.messaging.dlq-routing-key=dlq.routing.key

andesstay.messaging.queues.notify-email=q.notify.email
andesstay.messaging.queues.notify-sms=q.notify.sms
andesstay.messaging.queues.notify-push=q.notify.push
andesstay.messaging.queues.housekeeping-tickets=q.housekeeping.tickets
andesstay.messaging.queues.docs-generate=q.docs.generate

andesstay.messaging.routing-keys.notify-email=notify.email
andesstay.messaging.routing-keys.notify-sms=notify.sms
andesstay.messaging.routing-keys.notify-push=notify.push
andesstay.messaging.routing-keys.housekeeping-ticket=housekeeping.ticket
andesstay.messaging.routing-keys.docs-generate=docs.generate