# Puerto del BFF
server.port=8080
spring.application.name=ms-andesstay-bff

# Azure AD (IDaaS)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/00d7b2a1-2793-4a06-883e-c37b29134049/v2.0
