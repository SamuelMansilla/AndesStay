# AndesStay — Configuración RabbitMQ (EP3 · entorno local)
# Referenciado por infra/mq/compose.yml (montado en /etc/rabbitmq/rabbitmq.conf en ambos nodos).
# Usuario, password y vhost se definen por variables de entorno en el compose
# (RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS / RABBITMQ_DEFAULT_VHOST).

# ── Listeners ────────────────────────────────────────────────────────────────
# AMQP (puerto publicado como 5672 en rabbitmq-1 y 5673 en rabbitmq-2)
listeners.tcp.default = 5672
# Management UI / HTTP API (publicado como 15672 y 15673)
management.tcp.port = 15672

# ── Recursos ─────────────────────────────────────────────────────────────────
# Umbral de memoria antes de bloquear publishers (0.6 de la RAM del contenedor)
vm_memory_high_watermark.relative = 0.6
# Mínimo de disco libre antes de bloquear publishers
disk_free_limit.absolute = 1GB

# ── Logging ──────────────────────────────────────────────────────────────────
log.console = true
log.console.level = info
